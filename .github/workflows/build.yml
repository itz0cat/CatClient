name: Build CatClient

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - ".gitignore"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Fabric 1.21.11 Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon -x test --stacktrace

      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatClient-1.21.11-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish or Update Latest Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          MAIN_JAR=$(find build/libs -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" ! -name "*-shadow.jar" | head -n 1)
          if [ -z "$MAIN_JAR" ]; then
            MAIN_JAR=$(find build/libs -name "*.jar" | head -n 1)
          fi
          echo "Selected jar: $MAIN_JAR"
          cp "$MAIN_JAR" dist/CatClient-1.21.11.jar
          gh release create latest dist/CatClient-1.21.11.jar \
            --title "CatClient 1.21.11" \
            --notes "Universal build for Minecraft 1.21.11, Fabric Loader 0.19.5, and Java 21." \
            --clobber || gh release upload latest dist/CatClient-1.21.11.jar --clobber
